# Edge reverse proxy — the only container published to the host.
#   /api/*  -> backend:8000   (the /api prefix is stripped)
#   /docs   -> backend Swagger UI
#   /*      -> frontend:80    (React SPA)

upstream pizza_backend {
    server backend:8000;
    keepalive 16;
}

upstream pizza_frontend {
    server frontend:80;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5M;
    server_tokens off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API ─────────────────────────────────────────────
    location /api/ {
        # Trailing slash strips /api: /api/auth/login -> /auth/login
        proxy_pass http://pizza_backend/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_read_timeout 60s;
    }

    # ── API docs (Swagger UI loads /openapi.json from the root) ──
    location = /docs         { proxy_pass http://pizza_backend/docs; }
    location = /redoc        { proxy_pass http://pizza_backend/redoc; }
    location = /openapi.json { proxy_pass http://pizza_backend/openapi.json; }

    # ── Frontend ────────────────────────────────────────
    location / {
        proxy_pass http://pizza_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
