# Staging stack: nginx (edge) -> frontend (React) + backend (FastAPI, SQLite)
#
# Run from the repository root:
#   cp docker/.env.staging.example docker/.env.staging   # then fill in secrets
#   docker compose -f docker/docker-compose.staging.yaml up -d --build
#
# A unique project name keeps this stack separate from any other compose
# project on the same server (container/network/volume names won't clash).
name: pizza-delivery-staging

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: pizza-delivery-backend:staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      # SQLite file lives on a named volume so data survives rebuilds
      DATABASE_URL: sqlite:////app/data/pizza_delivery.db
    volumes:
      - backend_data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    image: pizza-delivery-frontend:staging
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      # Change the left side if port 80 is already used on the server (e.g. "8081:80")
      - "${PIZZA_HTTP_PORT:-80}:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  backend_data:
